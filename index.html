<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>منشئ كشوفات نحن - تطبيق الهاتف</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts: Cairo -->
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- html2pdf.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" crossorigin="anonymous"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brandNavy: '#1F4E78',
            brandTeal: '#13B5C8',
            softBg: '#F8FAFC',
          },
          fontFamily: {
            cairo: ['Cairo', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'Cairo', sans-serif;
      background-color: #f1f5f9;
      -webkit-tap-highlight-color: transparent; /* إزالة وميض اللمس على الموبايل */
    }

    /* تحسينات ورقة العمل */
    .a4-paper {
      width: 100%;
      min-height: 100vh;
      margin: 0 auto;
      background-color: white;
      padding: 1rem;
      position: relative;
    }

    @media (min-width: 768px) {
      .a4-paper {
        max-width: 210mm;
        min-height: 297mm;
        margin: 2rem auto;
        padding: 15mm;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        border-radius: 8px;
      }
    }

    /* تحسين التعديل المباشر للهاتف */
    [contenteditable="true"] {
      transition: all 0.2s;
      outline: none;
      min-width: 30px;
      padding: 4px;
      border-radius: 4px;
    }
    
    [contenteditable="true"]:hover, [contenteditable="true"]:focus {
      background-color: #f0fdfa;
      box-shadow: inset 0 -2px 0 0 #13B5C8;
    }

    [contenteditable="true"]:empty:before {
      content: attr(data-placeholder);
      color: #cbd5e1;
      pointer-events: none;
      display: block;
    }

    /* إخفاء شريط التمرير الافتراضي وجعله أنيقاً */
    .hide-scrollbar::-webkit-scrollbar {
      height: 4px;
    }
    .hide-scrollbar::-webkit-scrollbar-track {
      background: #f1f1f1; 
      border-radius: 4px;
    }
    .hide-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1; 
      border-radius: 4px;
    }
    .hide-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #94a3b8; 
    }

    /* إعدادات الطباعة */
    @media print {
      body { background-color: white !important; }
      .a4-paper {
        width: 100%; max-width: none; min-height: auto; margin: 0; padding: 0; box-shadow: none; border-radius: 0;
      }
      .no-print { display: none !important; }
      .print-border { border-color: #000 !important; }
      th, td { border-color: #000 !important; color: #000 !important; }
      th.bg-brandNavy { background-color: #1F4E78 !important; -webkit-print-color-adjust: exact; color: white !important; }
      [contenteditable="true"] { padding: 0; box-shadow: none !important; background: transparent !important; }
      .overflow-x-auto { overflow: visible !important; }
    }
  </style>
</head>
<body class="flex flex-col min-h-screen text-slate-800">

  <!-- إشعار التلميح (Toast) -->
  <div id="toast" class="fixed top-5 left-1/2 transform -translate-x-1/2 bg-slate-800 text-white px-5 py-2.5 rounded-full opacity-0 transition-opacity duration-300 z-[200] pointer-events-none text-sm font-semibold shadow-lg text-center min-w-[200px]">
    رسالة
  </div>

  <!-- نافذة التأكيد المنبثقة (Modal) -->
  <div id="confirmModal" class="fixed inset-0 bg-slate-900/40 hidden flex items-center justify-center z-[150] px-4 backdrop-blur-sm transition-opacity">
    <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl transform transition-transform">
      <div class="w-12 h-12 rounded-full bg-red-100 flex items-center justify-center mb-4 mx-auto text-red-500 text-xl">
        <i class="fa-solid fa-triangle-exclamation"></i>
      </div>
      <h3 class="text-lg font-bold text-slate-800 mb-2 text-center" id="modalTitle">تأكيد الحذف</h3>
      <p class="text-slate-600 mb-6 text-sm text-center" id="modalMessage">هل أنت متأكد من رغبتك في الحذف؟</p>
      <div class="flex gap-3">
        <button id="modalCancelBtn" class="flex-1 py-2.5 rounded-xl bg-slate-100 text-slate-700 hover:bg-slate-200 font-bold text-sm transition">إلغاء</button>
        <button id="modalConfirmBtn" class="flex-1 py-2.5 rounded-xl bg-red-500 text-white hover:bg-red-600 font-bold text-sm shadow-lg shadow-red-500/30 transition">نعم، احذف</button>
      </div>
    </div>
  </div>

  <!-- الشريط العلوي البسيط -->
  <header class="no-print bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b border-slate-200 shadow-sm">
    <div class="px-4 py-3 flex items-center justify-center gap-2">
      <div class="w-8 h-8 bg-brandTeal rounded-lg flex items-center justify-center font-bold text-lg text-white shadow-sm">ن</div>
      <h1 class="font-bold text-brandNavy text-lg tracking-tight">منشئ الكشوفات</h1>
    </div>
  </header>

  <!-- مساحة العمل -->
  <main class="flex-1 w-full pb-24"> <!-- pb-24 لترك مساحة للشريط السفلي -->
    <div id="document-container" class="a4-paper flex flex-col">
      
      <!-- الترويسة -->
      <header class="text-center mb-6 relative mt-4">
        <div class="inline-block border-[3px] border-brandTeal bg-softBg rounded-2xl px-6 py-3 mb-5 w-full max-w-[220px] sm:max-w-xs shadow-sm">
          <h1 class="text-4xl sm:text-5xl font-extrabold text-brandTeal tracking-wider mb-1">نَــحْــنُ</h1>
          <p class="text-xs sm:text-sm font-bold text-brandNavy tracking-widest">NAHNO.ORG</p>
          <div class="h-px bg-brandTeal/30 w-3/4 mx-auto my-2"></div>
          <p class="text-[9px] sm:text-[10px] text-slate-600 font-bold">المنصة الوطنية لتطوع ومشاركة الشباب</p>
        </div>

        <div class="space-y-2">
          <div contenteditable="true" data-placeholder="أدخل العنوان الرئيسي" class="text-2xl sm:text-3xl font-black text-brandNavy inline-block min-w-[200px]">منتسبين أصدقاء سفراء</div>
          <br>
          <div contenteditable="true" data-placeholder="العنوان الفرعي" class="text-xl sm:text-2xl font-bold text-brandTeal inline-block min-w-[200px]">منصة نحن للتطوع</div>
          <br>
          <div contenteditable="true" data-placeholder="الجهة أو الجامعة" class="text-lg sm:text-xl font-bold text-brandNavy inline-block min-w-[200px]">جامعة إربد الأهلية</div>
        </div>
      </header>

      <!-- حاوية الجداول -->
      <div id="tables-wrapper" class="flex-1 space-y-10">
        <!-- يتم توليد الجداول هنا -->
      </div>

      <!-- التذييل -->
      <footer class="mt-10 pt-4 border-t-2 border-slate-200 text-center">
        <div contenteditable="true" data-placeholder="تذييل الصفحة..." class="text-xs sm:text-sm text-slate-500 font-bold inline-block min-w-[200px]">
          أصدقاء سفراء منصة نحن - جامعة إربد الأهلية
        </div>
      </footer>

    </div>
  </main>

  <!-- شريط التنقل السفلي للهواتف (Bottom Navigation) -->
  <nav class="no-print fixed bottom-0 left-0 w-full bg-white border-t border-slate-200 flex justify-around items-center p-2 pb-safe z-50 shadow-[0_-10px_20px_-10px_rgba(0,0,0,0.1)]">
    <button onclick="addTable()" class="flex-1 flex flex-col items-center justify-center py-2 text-slate-500 hover:text-brandNavy transition active:scale-95">
      <i class="fa-solid fa-table-list text-xl mb-1"></i>
      <span class="text-[10px] font-bold">جدول جديد</span>
    </button>
    <div class="w-px h-8 bg-slate-200"></div>
    <button onclick="window.print()" class="flex-1 flex flex-col items-center justify-center py-2 text-slate-500 hover:text-brandNavy transition active:scale-95">
      <i class="fa-solid fa-print text-xl mb-1"></i>
      <span class="text-[10px] font-bold">طباعة</span>
    </button>
    <div class="w-px h-8 bg-slate-200"></div>
    <button onclick="downloadPDF()" id="pdfBtn" class="flex-1 flex flex-col items-center justify-center py-2 text-brandTeal hover:text-teal-600 transition active:scale-95">
      <i class="fa-solid fa-file-pdf text-xl mb-1 drop-shadow-md"></i>
      <span class="text-[10px] font-bold">تنزيل PDF</span>
    </button>
  </nav>

  <script>
    // نظام الإشعارات (Toast)
    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.innerText = message;
      toast.classList.remove('opacity-0');
      setTimeout(() => {
        toast.classList.add('opacity-0');
      }, 2500);
    }

    // نظام النوافذ المنبثقة (Modal) للتأكيد بديل لـ confirm
    let confirmAction = null;
    const modal = document.getElementById('confirmModal');
    
    function showConfirm(title, message, onConfirm) {
      document.getElementById('modalTitle').innerText = title;
      document.getElementById('modalMessage').innerText = message;
      confirmAction = onConfirm;
      modal.classList.remove('hidden');
    }

    document.getElementById('modalCancelBtn').onclick = () => {
      modal.classList.add('hidden');
      confirmAction = null;
    };

    document.getElementById('modalConfirmBtn').onclick = () => {
      if (confirmAction) confirmAction();
      modal.classList.add('hidden');
      confirmAction = null;
    };

    // البيانات المبدئية
    let appState = {
      tables: [
        {
          id: 'table_' + Date.now(),
          title: 'كشف أسماء المنتسبين (انقر للتعديل)',
          headers: ['#', 'الاسم', 'التخصص', 'السنة الدراسية', 'الرقم الجامعي'],
          rows: [
            ['1', 'راما محمد خير العرايضة', 'قانون', 'السنة الثانية', '202511260'],
            ['2', 'ايلاف عرفات القاسم', 'دبلوم تمريض', 'غير محدد', 'بلا رقم جامعي'],
            ['3', 'أسماء نوفان الوريكات', 'اللغة العربية وآدابها', 'غير محدد', '202510776'],
            ['4', 'غزل زياد سالم ابو مراد', 'التمريض', 'السنة الأولى', '202520822'],
            ['5', 'دارين باسم الموسى', 'قانون', 'السنة الثانية', '202511005'],
            ['6', 'فرح فتحي محمد ناجي', 'التمريض', 'السنة الثالثة', '202410734'],
            ['7', 'قيس طلال غالب الجازي', 'نظم معلومات إدارية', 'السنة الثانية', '202420322'],
            ['8', 'تقى زيد الشبول', 'التمريض', 'السنة الثانية', '202520417'],
            ['9', 'عمار محمد خالد بني يوسف', 'تربية مهنية', 'السنة الثانية', '202520350'],
            ['10', 'منصور يونس عبيدات', 'تربية مهنية', 'السنة الثانية', '202510451']
          ]
        }
      ]
    };

    window.onload = () => {
      renderTables();
      // إضافة تلميح للمستخدمين الجدد
      setTimeout(() => showToast('يمكنك النقر على أي نص لتعديله مباشرة'), 1000);
    };

    function renderTables() {
      const wrapper = document.getElementById('tables-wrapper');
      wrapper.innerHTML = '';

      appState.tables.forEach((table, tableIndex) => {
        const tableHTML = `
          <div class="relative w-full" id="${table.id}">
            
            <div class="flex items-center justify-between mb-2 px-1">
              <div contenteditable="true" onblur="updateTableTitle(${tableIndex}, this.innerText)" data-placeholder="عنوان الجدول" class="text-lg sm:text-xl font-bold text-brandNavy min-w-[150px]">
                ${table.title}
              </div>
              <button onclick="requestDeleteTable(${tableIndex})" class="no-print w-8 h-8 flex items-center justify-center text-red-400 hover:text-red-600 hover:bg-red-50 rounded-full transition" title="حذف الجدول">
                <i class="fa-solid fa-trash"></i>
              </button>
            </div>

            <div class="no-print text-xs text-slate-400 mb-1 flex items-center gap-1 sm:hidden px-1">
              <i class="fa-solid fa-arrows-left-right"></i> اسحب لليمين واليسار لرؤية الجدول
            </div>

            <!-- حاوية الجدول القابلة للتمرير -->
            <div class="overflow-x-auto hide-scrollbar w-full border border-slate-300 rounded-lg sm:rounded-none sm:border-0 print-border">
              <table class="w-full border-collapse border border-slate-300 text-center text-xs sm:text-sm print-border min-w-[600px] sm:min-w-full bg-white">
                <thead>
                  <tr class="bg-brandNavy text-white">
                    ${table.headers.map((header, colIndex) => `
                      <th class="border border-slate-300 p-0 relative align-middle">
                        <div class="flex flex-col items-center p-1.5 pb-1">
                          <div contenteditable="true" onblur="updateHeader(${tableIndex}, ${colIndex}, this.innerText)" data-placeholder="عنوان" class="w-full text-center outline-none font-bold">${header}</div>
                          <button onclick="deleteColumn(${tableIndex}, ${colIndex})" class="no-print mt-1 text-white/50 hover:text-red-300 transition" title="حذف العمود">
                            <i class="fa-solid fa-trash-can text-[10px]"></i>
                          </button>
                        </div>
                      </th>
                    `).join('')}
                    <th class="no-print bg-slate-100 border border-slate-300 w-12 cursor-pointer hover:bg-slate-200 transition text-brandNavy" onclick="addColumn(${tableIndex})" title="إضافة عمود">
                      <i class="fa-solid fa-plus"></i>
                    </th>
                  </tr>
                </thead>

                <tbody>
                  ${table.rows.map((row, rowIndex) => `
                    <tr class="border-b border-slate-200 hover:bg-slate-50 transition print-border">
                      ${row.map((cell, colIndex) => `
                        <td class="border border-slate-300 p-0">
                          <div contenteditable="true" onblur="updateCell(${tableIndex}, ${rowIndex}, ${colIndex}, this.innerText)" class="w-full h-full p-2.5 outline-none min-h-[44px] flex items-center justify-center whitespace-pre-wrap">${cell}</div>
                        </td>
                      `).join('')}
                      <td class="no-print border border-slate-300 bg-slate-50 text-center w-12 p-0">
                        <button onclick="deleteRow(${tableIndex}, ${rowIndex})" class="w-full h-full min-h-[44px] text-red-400 hover:text-red-600 hover:bg-red-50 flex items-center justify-center transition">
                          <i class="fa-solid fa-minus"></i>
                        </button>
                      </td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>

            <button onclick="addRow(${tableIndex})" class="no-print mt-3 w-full py-3 border-2 border-dashed border-slate-300 text-slate-500 hover:text-brandTeal hover:border-brandTeal hover:bg-teal-50 text-sm font-bold rounded-xl transition flex items-center justify-center gap-2 active:scale-[0.98]">
              <i class="fa-solid fa-plus-circle"></i> إضافة صف جديد
            </button>

          </div>
        `;
        wrapper.insertAdjacentHTML('beforeend', tableHTML);
      });
    }

    function updateTableTitle(tIndex, val) { appState.tables[tIndex].title = val; }
    function updateHeader(tIndex, cIndex, val) { appState.tables[tIndex].headers[cIndex] = val; }
    function updateCell(tIndex, rIndex, cIndex, val) { appState.tables[tIndex].rows[rIndex][cIndex] = val; }

    function addRow(tIndex) {
      const table = appState.tables[tIndex];
      const newRowNumber = (table.rows.length + 1).toString();
      const newRow = table.headers.map((_, i) => i === 0 ? newRowNumber : '');
      table.rows.push(newRow);
      renderTables();
      showToast('تمت إضافة صف جديد');
    }

    function deleteRow(tIndex, rIndex) {
      const table = appState.tables[tIndex];
      if (table.rows.length > 1) {
        table.rows.splice(rIndex, 1);
        // إعادة الترقيم التلقائي للعمود الأول
        table.rows.forEach((row, idx) => {
          if (!isNaN(parseInt(row[0]))) row[0] = (idx + 1).toString();
        });
        renderTables();
      } else {
        showToast('لا يمكن حذف الصف الأخير، يجب ترك صف واحد على الأقل.');
      }
    }

    function addColumn(tIndex) {
      const table = appState.tables[tIndex];
      table.headers.push('عنوان');
      table.rows.forEach(row => row.push(''));
      renderTables();
      showToast('تمت إضافة عمود جديد');
    }

    function deleteColumn(tIndex, cIndex) {
      const table = appState.tables[tIndex];
      if (table.headers.length > 1) {
        table.headers.splice(cIndex, 1);
        table.rows.forEach(row => row.splice(cIndex, 1));
        renderTables();
      } else {
        showToast('يجب إبقاء عمود واحد على الأقل.');
      }
    }

    function addTable() {
      appState.tables.push({
        id: 'table_' + Date.now(),
        title: 'جدول جديد',
        headers: ['الرقم', 'البيان', 'ملاحظات'],
        rows: [['1', '', ''], ['2', '', '']]
      });
      renderTables();
      showToast('تم إنشاء جدول جديد');
      // التمرير للأسفل لرؤية الجدول الجديد
      window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }

    function requestDeleteTable(tIndex) {
      showConfirm(
        'حذف الجدول',
        'هل أنت متأكد أنك تريد حذف هذا الجدول بالكامل؟ لا يمكن التراجع عن هذا الإجراء.',
        () => {
          appState.tables.splice(tIndex, 1);
          renderTables();
          showToast('تم حذف الجدول بنجاح');
        }
      );
    }

    function downloadPDF() {
      const element = document.getElementById('document-container');
      const btn = document.getElementById('pdfBtn');
      const originalHtml = btn.innerHTML;
      
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin text-xl mb-1"></i><span class="text-[10px] font-bold">جاري التحضير...</span>`;
      btn.style.pointerEvents = 'none';

      // إخفاء العناصر التي لا يجب طباعتها
      const noPrintElements = document.querySelectorAll('.no-print');
      noPrintElements.forEach(el => el.style.display = 'none');

      // إزالة قيود التمرير لضمان طباعة الجدول بالكامل دون اقتصاص
      const scrollableDivs = document.querySelectorAll('.overflow-x-auto');
      scrollableDivs.forEach(div => {
        div.classList.remove('overflow-x-auto');
        div.style.overflow = 'visible';
      });

      const opt = {
        margin:       0,
        filename:     'كشف_أصدقاء_السفراء.pdf',
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2, useCORS: true, letterRendering: true, windowWidth: 1024 },
        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
      };

      html2pdf().set(opt).from(element).save().then(() => {
        // إعادة الواجهة لطبيعتها
        noPrintElements.forEach(el => el.style.display = '');
        scrollableDivs.forEach(div => div.classList.add('overflow-x-auto'));
        btn.innerHTML = originalHtml;
        btn.style.pointerEvents = 'auto';
        showToast('تم تحميل ملف PDF بنجاح!');
      }).catch(err => {
        console.error(err);
        noPrintElements.forEach(el => el.style.display = '');
        scrollableDivs.forEach(div => div.classList.add('overflow-x-auto'));
        btn.innerHTML = originalHtml;
        btn.style.pointerEvents = 'auto';
        showToast('عذراً، حدث خطأ أثناء إنشاء الملف.');
      });
    }
  </script>
</body>
</html>
